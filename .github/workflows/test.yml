on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"

name: Test
jobs:
  Build:
    strategy:
      matrix:
        go-version: [1.25.x]
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Test
        run: gotestsum -f testname -- ./... -race -count=1 -shuffle=on --timeout=5m

      # gwx 与 pbx 是独立嵌套模块，根模块的 ./... 不包含它们，需要分别跑
      # 它们各自多带一条重依赖（go-rpc-gateway / go-pbmo），这正是拆模块的目的
      # [EN] gwx and pbx are nested modules excluded from the root module's ./...,
      # each carrying one heavy dependency, which is the point of splitting them out
      - name: Test gwx submodule
        working-directory: ./gwx
        run: gotestsum -f testname -- ./... -race -count=1 -shuffle=on --timeout=5m

      - name: Test pbx submodule
        working-directory: ./pbx
        run: gotestsum -f testname -- ./... -race -count=1 -shuffle=on --timeout=5m

      - name: Coverage
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: go test ./... -race -count=1 -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          flags: unittests
          slug: kamalyes/go-bizerror
